slug: edge-fleet
title: "Spanner Omni + Kineviz: blast radius across an edge fleet"
summary: >
  Build a Spanner property graph of a synthetic edge fleet — sites, gateways,
  devices, firmware and the technicians who cover them — in a Spanner Omni
  deployment on your own machine, then find what actually falls over when one
  box does. The premise Omni is for: the data never leaves the site.

status: preview
maturity_note: >
  Spanner Omni is pre-GA and covered by Google's Pre-GA Offerings Terms. A
  deployment stops accepting writes 90 days after you create it, and the preview
  build supports no TLS or authentication, so the endpoint must stay on a
  network you trust. Kineviz has no native Spanner Omni connector yet either —
  see connect/README.md for the two routes that do work.
last_verified: 2026-08-20
verified_with:
  omni_version: "2026.r1-beta.2"
  platform: "macOS 15 (Apple Silicon), Docker Desktop 28.0.1"

backend:        spanner-omni
connection:     database-proxy
query_language: [gql]
use_case:       [asset-management, reliability, vulnerability-management, offline-analytics]
industry:       [manufacturing, logistics, retail]

difficulty:     intermediate
time_minutes:   12

cost:
  estimate_usd: 0.00
  bounded_by: >
    nothing here is billable. Spanner Omni runs as a container on the machine
    you are sitting at, the fleet is generated locally, and no request leaves the
    host. The real budget is hardware, not money — see local_resources.
  billable_resources: []
  local_resources:
    vcpu: 4
    ram_gb: 16
    disk_gb: 20

inputs: []

requires:
  cli:    [docker, python3]
  omni_version: "2026.r1-beta.2"
  kineviz_desktop: ">=0.17.1"
  kineviz_account: true

steps:
  - id: preflight
    run: ./scripts/preflight.sh
  - id: setup
    run: ./scripts/setup.sh
    creates:
      - "spanner-omni://default/default/${OMNI_DATABASE}"
      - "demos/edge-fleet/data/generated/"
  - id: verify
    run: ./scripts/verify.sh
    asserts: "GQL finds a concentration gateway and a transitive dependency cascade behind it"
  - id: handoff
    run: ./scripts/handoff.sh

teardown: ./scripts/teardown.sh
maintainer: "@kineviz/solutions"
