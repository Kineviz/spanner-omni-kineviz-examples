-- The schemaless proof, drawn — and it works either side of the insert.
--
-- ../05-prove-schemaless.sql makes the argument as two rows: the catalog knows
-- one label, the data carries seven. This makes it as a picture.
--
-- For the label space alone, Kineviz has this built in: type `:schema` into the
-- Query tab and it draws one node per label and one edge per relationship type,
-- every one of them discovered by reading rows. Use that first. It draws a copy
-- cached when the project opened, though, so a label added mid-session shows up
-- only after a reopen — this file queries the database and does not need one.
--
-- Run it as-is and you get the four mule accounts with their SSN, email and
-- phone: sixteen nodes, all of them labels that exist only because a row says
-- so. Then, in a terminal:
--
--     ./scripts/prove-schemaless.sh --keep
--
-- which adds a node type and an edge type with no DDL, no schema update and no
-- restart. Run this again and a seventeenth node joins the same picture — a
-- :regulator, wired to the collector by :reported_to.
--
-- Nothing on the canvas marks it out as newer than the rest. :ssn, :email and
-- :phonenumber arrived the same way it did, and none of the four is in the
-- schema. That indistinguishability is the claim.
--
-- Put it back with:
--
--     ./scripts/prove-schemaless.sh --undo
--
-- The `->{0,1}` on the last hop is what lets one file serve both states: a
-- quantifier of zero-or-one makes that step optional, and at zero hops the tail
-- binds to the account itself, so nothing extra is drawn. An OPTIONAL clause
-- would be the obvious way to write this and does not survive the proxy's
-- rewrite — see README.md in this folder.
--
-- Kineviz only.
GRAPH PaysimGraph
MATCH (i)<-[hi:has_ssn|has_email|has_phone]-(c:client)-[rep:reported_to]->{0,1}(g)
WHERE STRING(c.client_type) = 'MULE'
RETURN i, hi, c, rep, g
