-- The schemaless proof, drawn — and it works either side of the insert.
--
-- ../05-prove-schemaless.sql makes the argument as two rows: the catalog knows
-- one label, the data carries seven. This makes it as a picture.
--
-- As-is it draws the four mule accounts with their SSN, email and phone:
-- sixteen nodes, every label there only because a row says so. To add one more,
-- paste these into this same Query tab — no DDL, no schema update, no restart:
--
--     INSERT INTO GraphNode (id, label, properties)
--     VALUES ('regulator_R01', 'regulator',
--             JSON'{"name": "Financial Conduct Authority", "jurisdiction": "UK"}')
--
--     INSERT INTO GraphEdge (id, dest_id, edge_id, label, properties)
--     VALUES ('client_C0394', 'regulator_R01', 'sar1', 'reported_to',
--             JSON'{"filed": "2026-02-01", "reason": "structuring"}')
--
-- Each answers rows_affected 1. Run this file again and a seventeenth node
-- joins the same picture: a :regulator, wired to the collector by :reported_to.
-- Nothing on the canvas marks it out as newer than the rest — :ssn, :email and
-- :phonenumber arrived the same way, and none of the four is in the schema.
-- That indistinguishability is the claim.
--
-- Undo, same panel:
--
--     DELETE FROM GraphEdge WHERE id='client_C0394'
--       AND dest_id='regulator_R01' AND edge_id='sar1'
--
--     DELETE FROM GraphNode WHERE id='regulator_R01'
--
-- ../../scripts/prove-schemaless.sh does the same from a terminal, with an
-- assertion attached and cleanup on every exit path. Use the panel to show it,
-- the script to test it.
--
-- `:schema` draws the whole label space in one command, but from a copy cached
-- when the project opened, so a label added mid-session appears there only
-- after a reopen. This file queries the database, so it does not need one.
--
-- The `->{0,1}` is what lets one file serve both states: zero-or-one makes the
-- hop optional, and at zero hops the tail binds to the account itself, so
-- nothing extra is drawn. An OPTIONAL clause is the obvious way to write that
-- and does not survive the proxy's rewrite — see README.md in this folder.
--
-- Kineviz only.
GRAPH PaysimGraph
MATCH (i)<-[hi:has_ssn|has_email|has_phone]-(c:client)-[rep:reported_to]->{0,1}(g)
WHERE STRING(c.client_type) = 'MULE'
RETURN i, hi, c, rep, g
