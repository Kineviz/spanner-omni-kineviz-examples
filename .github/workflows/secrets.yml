name: secrets

on:
  pull_request:
  push:
    branches: [main]

# Blocking, from the first commit. This repo is public and hands out database
# instructions; a sibling repo already shipped a committed .env once, so this
# gate exists before anyone can make that mistake here.
#
# We run the gitleaks CLI directly rather than gitleaks-action, because that
# action requires a paid license for organization-owned repos. The CLI itself
# is open source and is the same scanner. Version is pinned, per the repo's
# no-`:latest` rule.
env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Working tree: catches a secret in the files as they stand today.
      - name: Scan working tree
        run: gitleaks dir . --redact --exit-code 1

      # History: catches a secret that was committed and later "removed".
      # Deleting a file does not remove it from the history.
      - name: Scan git history
        run: gitleaks git . --redact --exit-code 1

  no-credential-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Belt and braces: gitleaks catches key *contents*, this catches a
      # committed .env or key file even if it is empty or placeholder-only.
      - name: Reject committed credential files
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)(\.env|.*\.env)$|(^|/).*key\.json$|(^|/).*credentials.*\.json$' \
                | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Credential files must never be committed:"
            echo "$bad"
            echo "Use .env.example with defaults instead."
            exit 1
          fi
          echo "no credential files committed"
